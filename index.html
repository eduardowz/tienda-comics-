<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tienda de Cómics</title>
  <link rel="stylesheet" href="style.css">
  <script src="filtro.js" defer></script>
</head>
<body>
  <header>
    <h1>Tienda de Cómics</h1>
    <p>Los mejores títulos en un solo lugar</p>
  </header>

  <main>
    <h2>Catálogo</h2>
    <section class="catalogo" id="catalogo">
      <article class="producto" data-categoria="superheroes">
        <h3>Spider-Man: Azul</h3>
        <p>Precio: $350</p>
      </article>
      <article class="producto" data-categoria="superheroes">
        <h3>Batman: Año Uno</h3>
        <p>Precio: $320</p>
      </article>
      <article class="producto" data-categoria="manga">
        <h3>Naruto Vol. 1</h3>
        <p>Precio: $180</p>
      </article>
      <article class="producto" data-categoria="manga">
        <h3>One Piece Vol. 1</h3>
        <p>Precio: $190</p>
      </article>
      <article class="producto" data-categoria="novelas-graficas">
        <h3>Maus</h3>
        <p>Precio: $420</p>
      </article>
      <article class="producto" data-categoria="novelas-graficas">
        <h3>Persépolis</h3>
        <p>Precio: $390</p>
      </article>
    </section>
  </main>

  <footer>
    <p>Tienda de Cómics &copy; 2026</p>
  </footer>
</body>
</html>
